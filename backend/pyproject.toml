[project]
name = "science-net-backend"
version = "1.0.0"
description = "Backend portalu Science Net (FastAPI)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    "httpx2==2.13.1",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ARG", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
