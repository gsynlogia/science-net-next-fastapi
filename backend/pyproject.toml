[project]
name = "science-net-backend"
version = "1.0.0"
description = "Backend portalu Science Net (FastAPI)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ARG", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
