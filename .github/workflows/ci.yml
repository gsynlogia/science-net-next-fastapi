name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 24.22.0
  PYTHON_VERSION: "3.13"
  UV_VERSION: 0.13.1

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: sciencenet
          POSTGRES_PASSWORD: sciencenet
          POSTGRES_DB: sciencenet
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sciencenet -d sciencenet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install uv==${{ env.UV_VERSION }}
      - run: cp .env.example .env
      - run: uv sync --frozen
      - run: ./check.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: cp .env.example .env.local
      - run: npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: sciencenet
          POSTGRES_PASSWORD: sciencenet
          POSTGRES_DB: sciencenet
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sciencenet -d sciencenet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pip install uv==${{ env.UV_VERSION }}
      - name: Przygotuj backend (zależności, schemat bazy, dane demonstracyjne)
        working-directory: backend
        run: |
          cp .env.example .env
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m app.seed
      - name: Przygotuj frontend (zależności i przeglądarka)
        working-directory: frontend
        run: |
          cp .env.example .env.local
          npm ci
          npx playwright install --with-deps chromium
      - name: Testy end-to-end
        working-directory: frontend
        run: npm run e2e
      - name: Zapisz raport przy błędzie
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: frontend/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
